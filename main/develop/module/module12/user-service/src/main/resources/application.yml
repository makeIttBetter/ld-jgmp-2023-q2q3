server:
  port: 9001

spring:
  application:
    name: USER-SERVICE

  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

#management:
#  endpoints:
#    web:
#      exposure:
#        include: "*"


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER:http:/localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
