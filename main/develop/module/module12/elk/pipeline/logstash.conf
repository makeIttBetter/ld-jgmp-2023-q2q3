input {
  tcp {
    port => 5044
    codec => json_lines {}
  }
}

filter {
  # Add any parsing or field transformations if needed
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST:http://elasticsearch}:9200"]
    index => "logs-%{+YYYY.MM.dd}"
    user => "elastic"          # If security is enabled
    password => "changeme"     # If security is enabled
    ilm_enabled => true
    ilm_policy => "log_policy"
    ilm_rollover_alias => "logs"
  }
  stdout {
    codec => rubydebug
  }
}
